name: Site changed / selectors broke
description: homedepot.com changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        homedepot.com moved.

        Useful to know before filing: **a listing page carries no product
        tiles in its markup.** Its products come from the page's own
        `window.__APOLLO_STATE__`; a product page's come from its `Product`
        JSON-LD block. So "the markup changed" is rarely the diagnosis.

        Three things can move: whether the page still embeds that state or
        JSON-LD, the `SearchModel` and `base-searchNav-<itemId>` nodes inside
        the state, or the fields on a product node. Saying which narrows the
        fix a lot, and pasting the fragment beats describing it.

  - type: dropdown
    id: mode
    attributes:
      label: Which --mode
      options:
        - category
        - product
        - not sure / more than one
    validations:
      required: true

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows from a leaf category that has products)
        - A specific field is null or wrong (price, availability, store, stock, ...)
        - The page parsed to 0 rows although it lists products (a parser failure)
        - Every request is refused with a ~370-byte 403 (that is the EXIT, not the site)
        - The interstitial no longer clears in a browser
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact page URL you ran against.
      placeholder: "https://www.homedepot.com/b/Tools-Power-Tools-Saws-Miter-Saws/N-5yc1vZc2d7"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - The `base-searchNav-<itemId>` node for ONE product from the
          listing's `__APOLLO_STATE__` (`--dump-html` saves the page), or the
          `Product` JSON-LD block from a product page.
        - For a field problem: the value you got, and the value in the page.
        - For a refusal: the status and size the run logged. Akamai's 403 is
          a few hundred bytes and names your exit address's refusal, not a
          parser bug.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, and when it last worked.

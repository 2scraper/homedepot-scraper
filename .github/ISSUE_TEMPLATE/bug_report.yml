name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps do not.
        Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Exit 3 (blocked)?** homedepot.com refuses non-US exits and
          requests that do not look like a browser. Check which exit the run
          used (the sidecar's `transport_facts.exit`) before anything else —
          the README's first section has the measurements.
        - **Exit 4 on a category that obviously has products?** A top-level
          category such as `/b/Tools/N-5yc1vZc1xy` is a HUB with no grid; the
          run says so. Pick a leaf category.
        - **Exit 5?** The site was never reached: a timeout, a dropped
          connection, a proxy credential that no longer authenticates.
        - **Prices differ from what you see in your browser?** Home Depot
          prices per STORE. Every row carries `store_id`; compare against the
          same store.
        - **`sku` and the store SKU on the product page disagree?** They are
          supposed to. `sku` is the `itemId` at the end of the `/p/` URL;
          the page's own store SKU is kept in `store_sku`.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - http_scraper.py (the primary engine — start here)
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which --mode
      options:
        - category
        - product
        - not applicable
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - No browser at all (http_scraper.py, plain HTTPS through a proxy)
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py, through the vendor's exits)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        refusal, 4 is "ran fine, found nothing", 5 is "never reached the
        site", 6 is a partial run. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 http_scraper.py \
          --url https://www.homedepot.com/b/Tools-Power-Tools-Saws-Miter-Saws/N-5yc1vZc2d7 \
          --pages 3 --out miter
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        35 rows over 3 pages, as the README's measured results for Miter Saws
        show.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true

name: canary

# ONE real run a week (Mondays; every run bills the proxy or Scraping Browser) against a known-good leaf category, to catch the site
# changing its markup before a user does.
#
# It requests THREE pages on purpose. With one page pagination is never
# exercised, and a run that silently fetched one page would read as complete.
#
# This canary CANNOT pass without an exit, and it says so in red. homedepot.com
# answers HTTP 403 to a non-US address and a GitHub runner is a datacentre
# address (README, measured 2026-09-22), so it needs ONE of these secrets:
#
#   HOMEDEPOT_PROXY         a US residential proxy URL. Runs http_scraper.py,
#                           the repo's primary engine and its free path.
#   HOMEDEPOT_CDP_ENDPOINT  a Scraping Browser endpoint with country-us. Runs
#                           playwright_scraper.py over CDP. (A LOCAL Chromium
#                           behind a proxy was refused 10 of 10 times in the
#                           README's measurements, so it is not used here.)
#
# With neither, the job FAILS with an ::error:: naming them. A canary that
# skipped green every day for weeks tested nothing, and its badge said it did.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; weekly because every run bills a paid route
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-22.04
    env:
      # `secrets` is not available in a job-level `if`, so presence is tested
      # through job env and read in each step's `if`.
      HAS_PROXY: ${{ secrets.HOMEDEPOT_PROXY != '' }}
      HAS_CDP: ${{ secrets.HOMEDEPOT_CDP_ENDPOINT != '' }}
      CANARY_URL: https://www.homedepot.com/b/Tools-Power-Tools-Saws-Miter-Saws/N-5yc1vZc2d7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require an exit
        if: env.HAS_PROXY != 'true' && env.HAS_CDP != 'true'
        run: |
          echo "::error::Missing secret: set HOMEDEPOT_PROXY (a US residential proxy, runs http_scraper.py) or HOMEDEPOT_CDP_ENDPOINT (a country-us Scraping Browser endpoint, runs playwright_scraper.py). homedepot.com refuses a GitHub runner's address, so without one this canary cannot reach the site and has not tested anything."
          exit 1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$HAS_PROXY" != "true" ]; then
            # Over CDP the browser is remote: the Python package is enough,
            # no local Chromium is downloaded.
            pip install -r requirements-playwright.txt
          fi

      - name: Live run
        # The credential goes through the ENVIRONMENT, never a --proxy flag on
        # the command line: env_config.py reads exactly these names, and argv
        # is readable by `ps` and lands in CI logs.
        env:
          HOMEDEPOT_PROXY: ${{ secrets.HOMEDEPOT_PROXY }}
          HOMEDEPOT_CDP_ENDPOINT: ${{ secrets.HOMEDEPOT_CDP_ENDPOINT }}
        run: |
          # GitHub runs `run:` under `bash -e`; capture the exit code first.
          set +e
          if [ "$HAS_PROXY" = "true" ]; then
            unset HOMEDEPOT_CDP_ENDPOINT
            python3 http_scraper.py --url "$CANARY_URL" \
              --pages 3 --out canary --format both --verbose --proxy-budget-mb 10
          else
            unset HOMEDEPOT_PROXY
            python3 playwright_scraper.py --url "$CANARY_URL" \
              --pages 3 --out canary --format both --verbose --proxy-budget-mb 10
          fi
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_ENV"
          echo "scraper exit code: $rc"

      # What the run sent through HOMEDEPOT_PROXY, read from its sidecar; red
      # when it stopped at the 10 MB budget (stop_reason proxy_budget_exceeded).
      # Over CDP no local proxy is metered and the line says so.
      - name: Proxy traffic
        if: always()
        run: python3 .github/proxy_traffic_summary.py canary live 10

      - name: Assert the exit code and the data
        run: |
          case "$rc" in
            0) ;;
            3) echo "::error::exit 3: the site refused this exit. The secret is set but its address is not served — use a US residential exit."; exit 1 ;;
            4) echo "::error::exit 4: zero products from a category that has them."; exit 1 ;;
            5) echo "::error::exit 5: the site was never reached (timeout, dead proxy, expired CDP endpoint), or a served page parsed to nothing."; exit 1 ;;
            6) echo "::error::exit 6: a partial run."; exit 1 ;;
            *) echo "::error::scraper exited $rc"; exit 1 ;;
          esac
          # The row floor, core fields and pagination live in ci_checks.py, so
          # they can be run locally against any output.
          python3 .github/ci_checks.py --run-check --output-prefix canary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-output
          path: |
            canary.json
            canary.csv
            canary*.meta.json
          if-no-files-found: ignore
